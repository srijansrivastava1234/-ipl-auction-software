name: IPL Auction Software CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Backend Build, Static Analysis & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Executable Rights to Maven Wrapper
        run: chmod +x mvnw

      - name: Compile Backend Application
        run: ./mvnw clean compile -f backend/pom.xml -DskipTests

      - name: Run Automated JUnit 5 & Concurrency Tests
        run: ./mvnw test -f backend/pom.xml

      - name: Upload Surefire Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
