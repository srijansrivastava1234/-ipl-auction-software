# ================================================
# IPL Auction — Test Profile Properties (Member 5)
# Uses H2 in-memory DB to avoid MySQL dependency
# ================================================

# ── H2 In-Memory Database for Tests ──
spring.datasource.url=jdbc:h2:mem:ipl_auction_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA / Hibernate (Auto-create schema for tests) ──
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── H2 Console (for debugging tests) ──
spring.h2.console.enabled=true

# ── Swagger (disabled during tests for speed) ──
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── JWT Test Configuration ──
jwt.secret=test-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
jwt.expiration=3600000

# ── Logging (reduce noise during tests) ──
logging.level.com.ipl.auction=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG
