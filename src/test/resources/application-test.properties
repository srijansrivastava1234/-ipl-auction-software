# ================================================
# IPL Auction — Test Profile Properties (Member 5)
# Uses H2 in-memory DB to avoid MySQL dependency
# ================================================

# ── H2 In-Memory Database for Tests ──
spring.datasource.url=jdbc:h2:mem:ipl_auction_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=YEAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ── SQL Init ──
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# ── Swagger (disabled during tests) ──
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── JWT Test Configuration ──
jwt.secret=test-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
jwt.expiration-ms=3600000

# ── Logging ──
logging.level.root=WARN
logging.level.com.ipl.auction=INFO

